---
layout: page
title: Field Notes
permalink: /field-notes/
---

<div style="max-width:680px;">
  {% for note in site.field_notes reversed %}
  <div class="home-box" style="margin-bottom:1rem; padding:1.25rem;">
    <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;">
      <p style="font-size:16px; font-weight:600; margin:0;">{{ note.title }}</p>
      <p style="font-size:12px; color:#888; margin:0;">{{ note.date | date: "%B %-d, %Y" }}</p>
    </div>
    <div style="font-size:14px; line-height:1.7;">
      {{ note.content }}
    </div>
  </div>
  {% endfor %}
</div>
